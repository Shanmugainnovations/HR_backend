<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Reset Your Password - Shanmuga Hospital Limited</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Poppins', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            overflow: hidden;
            position: relative;
        }

        /* Animated background elements */
        body::before {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: radial-gradient(circle, rgba(255,255,255,0.1) 1px, transparent 1px);
            background-size: 50px 50px;
            animation: float 20s ease-in-out infinite;
        }

        @keyframes float {
            0%, 100% { transform: translate(0, 0) rotate(0deg); }
            50% { transform: translate(-20px, -20px) rotate(180deg); }
        }

        .container {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(20px);
            padding: 50px 40px;
            border-radius: 24px;
            box-shadow: 0 25px 50px rgba(0, 0, 0, 0.15), 0 0 0 1px rgba(255, 255, 255, 0.1);
            width: 100%;
            max-width: 450px;
            position: relative;
            border: 1px solid rgba(255, 255, 255, 0.2);
            animation: slideUp 0.8s ease-out;
        }

        @keyframes slideUp {
            from { opacity: 0; transform: translateY(50px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .header {
            text-align: center;
            margin-bottom: 40px;
        }

        .hospital-logo {
            width: 80px;
            height: 80px;
            margin: 0 auto 20px;
            background: linear-gradient(135deg, #667eea, #764ba2);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 10px 30px rgba(102, 126, 234, 0.3);
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.05); }
        }

        .hospital-logo::before {
            content: '🏥';
            font-size: 32px;
            filter: grayscale(1) brightness(10);
        }

        h2 {
            color: #2d3748;
            font-weight: 600;
            font-size: 28px;
            margin-bottom: 8px;
            background: linear-gradient(135deg, #667eea, #764ba2);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .subtitle {
            color: #718096;
            font-size: 14px;
            font-weight: 400;
        }

        .hospital-name {
            color: #4a5568;
            font-size: 12px;
            font-weight: 500;
            margin-top: 5px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .form-group {
            position: relative;
            margin-bottom: 25px;
        }

        input[type="password"], input[type="text"] {
            width: 100%;
            padding: 18px 20px;
            border: 2px solid #e2e8f0;
            border-radius: 16px;
            font-size: 16px;
            font-family: inherit;
            background: rgba(255, 255, 255, 0.8);
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            backdrop-filter: blur(10px);
        }

        input[type="password"]:focus, input[type="text"]:focus {
            border-color: #667eea;
            outline: none;
            box-shadow: 0 0 0 4px rgba(102, 126, 234, 0.1), 0 10px 25px rgba(102, 126, 234, 0.15);
            transform: translateY(-2px);
            background: rgba(255, 255, 255, 1);
        }

        input[type="password"]::placeholder, input[type="text"]::placeholder {
            color: #a0aec0;
            font-weight: 400;
        }

        .input-icon {
            position: absolute;
            right: 18px;
            top: 50%;
            transform: translateY(-50%);
            color: #a0aec0;
            font-size: 18px;
            cursor: pointer;
            transition: all 0.3s ease;
            user-select: none;
            padding: 5px;
            border-radius: 6px;
        }

        .input-icon:hover {
            color: #667eea;
            background: rgba(102, 126, 234, 0.1);
        }

        input:focus + .input-icon {
            color: #667eea;
        }

        .strength-meter {
            height: 4px;
            background: #e2e8f0;
            border-radius: 2px;
            margin-top: 8px;
            overflow: hidden;
        }

        .strength-bar {
            height: 100%;
            width: 0%;
            background: linear-gradient(90deg, #ef4444, #f59e0b, #10b981);
            transition: width 0.3s ease;
            border-radius: 2px;
        }

        button {
            width: 100%;
            padding: 18px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border: none;
            border-radius: 16px;
            font-size: 16px;
            color: white;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            position: relative;
            overflow: hidden;
            box-shadow: 0 10px 25px rgba(102, 126, 234, 0.3);
        }

        button::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.2), transparent);
            transition: left 0.5s ease;
        }

        button:hover::before {
            left: 100%;
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 15px 35px rgba(102, 126, 234, 0.4);
        }

        button:active {
            transform: translateY(0);
        }

        .loading {
            opacity: 0.7;
            pointer-events: none;
        }

        .loading::after {
            content: '';
            position: absolute;
            width: 20px;
            height: 20px;
            border: 2px solid rgba(255,255,255,0.3);
            border-top: 2px solid white;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            right: 20px;
            top: 50%;
            transform: translateY(-50%);
        }

        @keyframes spin {
            0% { transform: translateY(-50%) rotate(0deg); }
            100% { transform: translateY(-50%) rotate(360deg); }
        }

        .message {
            padding: 16px 20px;
            border-radius: 12px;
            margin-bottom: 25px;
            font-size: 14px;
            font-weight: 500;
            animation: slideIn 0.3s ease-out;
            backdrop-filter: blur(10px);
        }

        @keyframes slideIn {
            from { opacity: 0; transform: translateX(-20px); }
            to { opacity: 1; transform: translateX(0); }
        }

        .error {
            background: rgba(239, 68, 68, 0.1);
            color: #dc2626;
            border: 1px solid rgba(239, 68, 68, 0.2);
        }

        .success {
            background: rgba(16, 185, 129, 0.1);
            color: #047857;
            border: 1px solid rgba(16, 185, 129, 0.2);
        }

        .requirements {
            margin-top: 15px;
            padding: 16px;
            background: rgba(102, 126, 234, 0.05);
            border-radius: 12px;
            border: 1px solid rgba(102, 126, 234, 0.1);
        }

        .requirement {
            display: flex;
            align-items: center;
            margin: 5px 0;
            font-size: 13px;
            color: #718096;
            transition: color 0.3s ease;
        }

        .requirement.met {
            color: #10b981;
        }

        .requirement-icon {
            margin-right: 8px;
            font-size: 12px;
        }

        @media (max-width: 480px) {
            .container {
                padding: 40px 30px;
                margin: 10px;
            }
            h2 {
                font-size: 24px;
            }
        }

        /* Floating particles */
        .particle {
            position: absolute;
            background: rgba(255, 255, 255, 0.6);
            border-radius: 50%;
            pointer-events: none;
            animation: floatParticle 8s linear infinite;
        }

        @keyframes floatParticle {
            0% { transform: translateY(100vh) rotate(0deg); opacity: 0; }
            10% { opacity: 1; }
            90% { opacity: 1; }
            100% { transform: translateY(-100vh) rotate(360deg); opacity: 0; }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <div class="hospital-logo"></div>
            <h2>Reset Password</h2>
            <p class="subtitle">Create a new secure password for your account</p>
            <p class="hospital-name">Shanmuga Hospital Limited</p>
        </div>

        <div id="message"></div>

        <form id="resetForm">
            <div class="form-group">
                <input type="password" id="password" placeholder="New Password" required>
                <div class="input-icon" id="togglePassword" title="Show/Hide Password">👁️</div>
                <div class="strength-meter">
                    <div class="strength-bar" id="strengthBar"></div>
                </div>
            </div>

            <div class="form-group">
                <input type="password" id="confirmPassword" placeholder="Confirm Password" required>
                <div class="input-icon" id="toggleConfirmPassword" title="Show/Hide Password">👁️</div>
            </div>

            <div class="requirements">
                <div class="requirement" id="req-length">
                    <span class="requirement-icon">○</span>
                    At least 8 characters
                </div>
                <div class="requirement" id="req-match">
                    <span class="requirement-icon">○</span>
                    Passwords match
                </div>
            </div>

            <button type="submit" id="submitBtn">
                Reset Password
            </button>
        </form>
    </div>

    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const token = urlParams.get('token');
        const form = document.getElementById('resetForm');
        const messageDiv = document.getElementById('message');
        const passwordInput = document.getElementById('password');
        const confirmPasswordInput = document.getElementById('confirmPassword');
        const submitBtn = document.getElementById('submitBtn');
        const strengthBar = document.getElementById('strengthBar');
        const togglePassword = document.getElementById('togglePassword');
        const toggleConfirmPassword = document.getElementById('toggleConfirmPassword');

        // Toggle password visibility
        function togglePasswordVisibility(input, icon) {
            if (input.type === 'password') {
                input.type = 'text';
                icon.textContent = '🙈';
                icon.title = 'Hide Password';
            } else {
                input.type = 'password';
                icon.textContent = '👁️';
                icon.title = 'Show Password';
            }
        }

        togglePassword.addEventListener('click', function() {
            togglePasswordVisibility(passwordInput, togglePassword);
        });

        toggleConfirmPassword.addEventListener('click', function() {
            togglePasswordVisibility(confirmPasswordInput, toggleConfirmPassword);
        });

        // Create floating particles
        function createParticle() {
            const particle = document.createElement('div');
            particle.className = 'particle';
            particle.style.left = Math.random() * 100 + 'vw';
            particle.style.width = particle.style.height = Math.random() * 3 + 1 + 'px';
            particle.style.animationDuration = Math.random() * 3 + 5 + 's';
            document.body.appendChild(particle);
            setTimeout(() => particle.remove(), 8000);
        }

        setInterval(createParticle, 300);

        // Password strength checker
        function checkPasswordStrength(password) {
            let strength = 0;
            if (password.length >= 8) strength += 25;
            if (password.match(/[a-z]/)) strength += 25;
            if (password.match(/[A-Z]/)) strength += 25;
            if (password.match(/[0-9]/) || password.match(/[^a-zA-Z0-9]/)) strength += 25;
            return strength;
        }

        function updateRequirements() {
            const password = passwordInput.value;
            const confirmPassword = confirmPasswordInput.value;

            // Length requirement
            const lengthReq = document.getElementById('req-length');
            const lengthIcon = lengthReq.querySelector('.requirement-icon');
            if (password.length >= 8) {
                lengthReq.classList.add('met');
                lengthIcon.textContent = '✓';
            } else {
                lengthReq.classList.remove('met');
                lengthIcon.textContent = '○';
            }

            // Match requirement
            const matchReq = document.getElementById('req-match');
            const matchIcon = matchReq.querySelector('.requirement-icon');
            if (password && confirmPassword && password === confirmPassword) {
                matchReq.classList.add('met');
                matchIcon.textContent = '✓';
            } else {
                matchReq.classList.remove('met');
                matchIcon.textContent = '○';
            }
        }

        passwordInput.addEventListener('input', function() {
            const strength = checkPasswordStrength(this.value);
            strengthBar.style.width = strength + '%';
            updateRequirements();
        });

        confirmPasswordInput.addEventListener('input', updateRequirements);

        form.addEventListener('submit', async function (e) {
            e.preventDefault();
            messageDiv.innerHTML = '';

            const password = passwordInput.value;
            const confirmPassword = confirmPasswordInput.value;

            submitBtn.classList.add('loading');
            submitBtn.textContent = 'Resetting...';

            if (!token) {
                showMessage('Invalid or missing token in URL', 'error');
                resetButton();
                return;
            }

            if (password !== confirmPassword) {
                showMessage('Passwords do not match', 'error');
                resetButton();
                return;
            }

            if (password.length < 8) {
                showMessage('Password must be at least 8 characters', 'error');
                resetButton();
                return;
            }

            try {
                const response = await fetch('/_b_a_c_k_e_n_d/Global/reset-password/', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        token: token,
                        password: password,
                        confirm_password: confirmPassword
                    })
                });

                const result = await response.json();

                if (response.ok) {
                    showMessage(result.message || 'Password reset successfully! You can now login with your new password.', 'success');
                    form.reset();
                    strengthBar.style.width = '0%';
                    updateRequirements();
                } else {
                    showMessage(result.error || 'Something went wrong', 'error');
                }
            } catch (error) {
                showMessage('An error occurred. Please try again.', 'error');
                console.error(error);
            }

            resetButton();
        });

        function showMessage(message, type) {
            messageDiv.innerHTML = `<div class="message ${type}">${message}</div>`;
        }

        function resetButton() {
            submitBtn.classList.remove('loading');
            submitBtn.textContent = 'Reset Password';
        }
    </script>
</body>
</html>
